{% raw %}
<div id="rsnOverlay"
     style="display:none;position:fixed;inset:0;z-index:10200;
            background:rgba(2,6,12,0.78);backdrop-filter:blur(4px);
            align-items:center;justify-content:center;padding:24px;">
  <div style="width:100%;max-width:660px;max-height:88vh;overflow-y:auto;
              background:rgba(11,15,23,0.98);border:0.5px solid rgba(148,163,184,0.14);
              border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,0.6);
              font-family:'Inter',system-ui,sans-serif;">

    <!-- Header -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between;
                padding:20px 22px 12px;">
      <div>
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;
                    font-size:20px;color:#f1f5f9;letter-spacing:-0.3px;">Reasoning</div>
        <div style="font-size:12px;color:#64748b;margin-top:2px;">
          Assign NaviGator models to the long-term memory pipeline stages.</div>
      </div>
      <button onclick="closeReasoningModal()"
              style="background:none;border:none;color:#475569;font-size:22px;
                     cursor:pointer;line-height:1;padding:2px 6px;"
              onmouseover="this.style.color='#e2e8f0'"
              onmouseout="this.style.color='#475569'">&times;</button>
    </div>

    <!-- Division of labor -->
    <div style="display:flex;gap:10px;padding:0 22px 16px;">
      <div style="flex:1;background:rgba(34,211,238,0.06);
                  border:0.5px solid rgba(34,211,238,0.22);border-radius:10px;padding:11px 13px;">
        <div style="font-size:11px;font-weight:700;color:#22d3ee;text-transform:uppercase;
                    letter-spacing:0.05em;">Live · NaviGator</div>
        <div style="font-size:11.5px;color:#94a3b8;margin-top:4px;line-height:1.45;">
          In-app chat, UI action routing, fast turns.</div>
      </div>
      <div style="flex:1;background:rgba(124,58,237,0.07);
                  border:0.5px solid rgba(167,139,250,0.25);border-radius:10px;padding:11px 13px;">
        <div style="font-size:11px;font-weight:700;color:#a78bfa;text-transform:uppercase;
                    letter-spacing:0.05em;">Pipeline · NaviGator</div>
        <div style="font-size:11.5px;color:#94a3b8;margin-top:4px;line-height:1.45;">
          Offline: extraction → consolidation → reconciliation → read-path.</div>
      </div>
    </div>

    <!-- Stage → model assignment matrix -->
    <div style="padding:0 22px;">
      <div style="font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;
                  letter-spacing:0.06em;margin-bottom:8px;">Assign a model per stage</div>
      <div id="rsnStages"></div>
    </div>

    <!-- Embeddings caveat -->
    <div id="rsnEmbedNote"
         style="margin:14px 22px 4px;padding:10px 12px;border-radius:9px;
                background:rgba(251,191,36,0.06);border:0.5px solid rgba(251,191,36,0.22);
                font-size:11px;color:#cbd5e1;line-height:1.45;"></div>

    <!-- Footer -->
    <div style="display:flex;align-items:center;justify-content:space-between;
                gap:10px;padding:14px 22px 20px;margin-top:8px;">
      <div id="rsnStatus" style="font-size:11.5px;color:#64748b;flex:1;min-width:0;"></div>
      <button onclick="rsnTestConnection()"
              style="background:rgba(148,163,184,0.08);border:0.5px solid rgba(148,163,184,0.2);
                     color:#cbd5e1;font-size:12px;border-radius:8px;padding:8px 14px;cursor:pointer;">
        Test connection</button>
      <button onclick="rsnSaveAssignment()" id="rsnSaveBtn"
              style="background:#0e7490;border:none;color:#fff;font-size:12px;font-weight:600;
                     border-radius:8px;padding:8px 16px;cursor:pointer;"
              onmouseover="this.style.background='#0891b2'"
              onmouseout="this.style.background='#0e7490'">Save</button>
    </div>
  </div>
</div>

<script>
// ── Reasoning tool ────────────────────────────────────────────────────────────
const RSN_TIER_COLOR = {
  fast:     "#34d399",   // green
  mid:      "#22d3ee",   // cyan
  strong:   "#a78bfa",   // violet
  thinking: "#f0abfc",   // pink/violet
};
let _rsnModels = {}, _rsnStages = {}, _rsnAssignment = {};

function openReasoningModal() {
  document.getElementById('rsnOverlay').style.display = 'flex';
  rsnLoadModels();
}
function closeReasoningModal() {
  document.getElementById('rsnOverlay').style.display = 'none';
}
// click backdrop to close
document.getElementById('rsnOverlay').addEventListener('click', function (e) {
  if (e.target === this) closeReasoningModal();
});

function rsnLoadModels() {
  fetch('/reasoning/models')
    .then(r => r.json())
    .then(d => {
      _rsnModels = d.models; _rsnStages = d.stages; _rsnAssignment = d.assignment;
      document.getElementById('rsnEmbedNote').textContent = '⚠ ' + d.embedding_note;
      const cfg = d.configured
        ? `Gateway configured · ${d.api_style} API`
        : 'Gateway not configured — set CLAUDE_BASE_URL + CLAUDE_API_KEY';
      document.getElementById('rsnStatus').textContent = cfg;
      rsnRenderStages();
    })
    .catch(err => {
      document.getElementById('rsnStatus').textContent = 'Could not load /reasoning/models — is the blueprint registered?';
    });
}

function rsnRenderStages() {
  const wrap = document.getElementById('rsnStages');
  wrap.innerHTML = '';
  Object.entries(_rsnStages).forEach(([stage, desc]) => {
    const row = document.createElement('div');
    row.style.cssText =
      'display:flex;align-items:center;gap:12px;padding:10px 0;' +
      'border-bottom:0.5px solid rgba(148,163,184,0.08);';

    const left = document.createElement('div');
    left.style.cssText = 'flex:1;min-width:0;';
    left.innerHTML =
      `<div style="font-size:12.5px;color:#e2e8f0;font-weight:600;text-transform:capitalize;">${stage}</div>` +
      `<div style="font-size:11px;color:#64748b;margin-top:1px;">${desc}</div>`;

    const sel = document.createElement('select');
    sel.dataset.stage = stage;
    sel.style.cssText =
      'background:#0b0f17;color:#e2e8f0;border:0.5px solid rgba(148,163,184,0.22);' +
      'border-radius:8px;padding:7px 9px;font-size:12px;min-width:190px;cursor:pointer;';
    Object.entries(_rsnModels).forEach(([id, m]) => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = m.label;
      if (id === _rsnAssignment[stage]) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.onchange = () => rsnUpdateTier(sel);

    const tier = document.createElement('span');
    tier.id = 'rsnTier_' + stage;
    tier.style.cssText = 'font-size:10px;border-radius:6px;padding:2px 7px;white-space:nowrap;';

    row.appendChild(left); row.appendChild(sel); row.appendChild(tier);
    wrap.appendChild(row);
    rsnUpdateTier(sel);
  });
}

function rsnUpdateTier(sel) {
  const m = _rsnModels[sel.value] || {};
  const c = RSN_TIER_COLOR[m.tier] || '#64748b';
  const t = document.getElementById('rsnTier_' + sel.dataset.stage);
  t.textContent = (m.tier || '').toUpperCase();
  t.style.color = c;
  t.style.border = '0.5px solid ' + c + '55';
  t.title = m.note || '';
}

function rsnTestConnection() {
  const s = document.getElementById('rsnStatus');
  s.textContent = 'Pinging gateway…';
  fetch('/reasoning/health')
    .then(r => r.json())
    .then(d => {
      s.textContent = d.ok
        ? `✓ Reachable · ${d.model} · "${(d.sample || '').trim()}"`
        : `✗ ${d.reason || 'unreachable'}`;
      s.style.color = d.ok ? '#34d399' : '#f87171';
    })
    .catch(() => { s.textContent = '✗ request failed'; s.style.color = '#f87171'; });
}

function rsnSaveAssignment() {
  const body = {};
  document.querySelectorAll('#rsnStages select').forEach(sel => { body[sel.dataset.stage] = sel.value; });
  const btn = document.getElementById('rsnSaveBtn');
  btn.textContent = 'Saving…';
  fetch('/reasoning/assign', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  })
    .then(r => r.json())
    .then(d => {
      _rsnAssignment = d.assignment || _rsnAssignment;
      btn.textContent = 'Saved ✓';
      setTimeout(() => { btn.textContent = 'Save'; }, 1400);
    })
    .catch(() => { btn.textContent = 'Save'; });
}
</script>
{% endraw %}
