      default_receptor: "/home/huangzihang/repos/elion/src/visualizer/nas_storage_app/converted_pdbqt/receptor/IL-6_gp130.pdbqt"
      default_ligand:   "/home/huangzihang/repos/elion/src/visualizer/nas_storage_app/converted_pdbqt/ligand/G001a_IL-6_gp130_SP_Score_-4.214.pdbqt"
      center_x:  -0.127
      center_y:  2.204
      center_z:  -12.08
      size_x: 20
      size_y: 20
      size_z: 20
      exhaustiveness: 8
      num_modes: 9
      energy_range: 3
