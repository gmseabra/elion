      default_ligand:   "/home/huangzihang/repos/elion/src/visualizer/nas_storage_app/converted_pdbqt/ligand/Elion_iag933.pdbqt"
      center_x: -25.7
      center_y:   0.22
      center_z:  28.39
      size_x: 20
      size_y: 20
      size_z: 20
      exhaustiveness: 8
      num_modes: 9
      energy_range: 3
      cpu: null

    - id: "1P9M"
