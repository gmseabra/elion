# ============================================================
#  DeepAtom Virtual Screening Configuration
#  Used by: nas_storage_app/routes/deepatom_routes.py
#
#  Each dataset entry maps to one run of:
#    predict_binding_affinity_v4_2_data_split_ZccE_elion.sh
#      -t <test_type>   (e.g. "vs" for virtual screening)
#      -d <data_dir>    (absolute path to the dataset root)
#
#  timeout_seconds: max wait before killing the script.
#    540 augmented complexes takes ~5-10 min on CPU.
#    Set to 0 to wait forever (not recommended).
# ============================================================

deepatom:
  # ── Script ──────────────────────────────────────────────────────────────
  script: "/home/huangzihang/repos/elion/src/elion/properties/deepatom/bin/predict_binding_affinity_v4_2_data_split_ZccE_elion.sh"

  # ── Timeout ─────────────────────────────────────────────────────────────
  # Seconds before the script is killed. Increase for larger compound libraries.
  # 0 = no limit (not recommended — will block the server thread forever).
  timeout_seconds: 1200

  # ── Active dataset (pre-selected in the UI on load) ─────────────────────
  active_dataset: "ZccE_VS"

  # ── Dataset library ─────────────────────────────────────────────────────
  datasets:

    - id: "ZccE"
      label: "ZccE · Virtual Screening"
      description: "ZccE compound library — virtual screening mode"
      test_type: "vs"
      data_dir: "/home/huangzihang/repos/elion/src/elion/properties/deepatom/data/ZccE"
      active: true

    - id: "ZccE_Train"
      label: "ZccE · Training Set"
      description: "ZccE benchmark — training split evaluation"
      test_type: "train"
      data_dir: "/home/huangzihang/repos/elion/src/elion/properties/deepatom/data/ZccE"
      active: false

    - id: "ZccE_Test"
      label: "ZccE · Test Set"
      description: "ZccE benchmark — held-out test split"
      test_type: "test"
      data_dir: "/home/huangzihang/repos/elion/src/elion/properties/deepatom/data/ZccE"
      active: false
# ============================================================
#  Pose Generation tool defaults
#  Used by: nas_storage_app/routes/pose_routes.py
#    GET /pose/default_receptor serves this .pdb so the tool
#    opens with a default target loaded.
# ============================================================

pose:
  # Default ligand SMILES pre-filled into the Pose Generation tool's "LIGAND SMILES"
  # box (#poseSmiles) on open, so the tool builds a starting ligand with no typing.
  # The box stays editable; pressing Enter / Build re-parses whatever is typed.
  # Blank → falls back to the value hardcoded on the #poseSmiles input in hub.html.
  default_smile: "ClC(C(F)=CC1=C2C[C@](C3=CC=CC=C3)([C@@H]4CCCN4)O1)=[C@]2[C@@]5=C(C(NC)=O)C=NC(OCCO)=C5F"

  # Default receptor .pdb auto-loaded into the Pose Generation tool on open.
  # The "⤓ Upload .pdb" button overrides it per session.
  # Blank → no target loaded (docking box defaults to the ligand frame).
  # NOTE: this is a .pdb (the pose tool reads PDB, not the .pdbqt the Vina engine uses).
  default_receptor_pdb: "/home/huangzihang/repos/elion/src/elion/properties/deepatom/data/8P0M/protein/8P0M_Prepared_water_605_632.pdb"

  # Folder where receptors uploaded via the "⤓ Upload .pdb" button are archived
  # server-side (created if missing), so the user can find the uploaded .pdb later.
  # Blank → uploads are not archived (kept in-browser only).
  default_upload_path: "/home/huangzihang/repos/user_data/uploaded_pdb"

  # "⚛ Score best pose" runs:  <default_script> -t vs -d <default_dir>
  # default_script : the DeepAtom scoring entry-point (the dispatcher).
  # default_dir    : pre-filled into the card's output-dir field on open, and used
  #                  as -d if that field is cleared; a value typed there overrides it.
  default_script: "/home/huangzihang/repos/elion/src/elion/properties/deepatom/bin/deepatom_score_pipeline.sh"

  # "Yupu_GIGN" scorer -- third option in the (3) Monte-Carlo "Scorer" dropdown.
  # "Score (GIGN)" scores the LIVE pose: the posed ligand + the loaded receptor.
  # The endpoint stages them and runs:
  #     python <gign_script> --stage <dir> --name <name>
  # with cwd = the script's own dir, inside <gign_conda_env>. yupu_GIGN_pose.py
  # builds the GIGN graph and runs the model, printing GIGN_PRED_PK.
  #
  # gign_pocket_cutoff: 5 = cut the 5 angstrom binding pocket (whole protein
  #   residues within 5 A of the ligand, waters dropped) -- this MATCHES how the
  #   model was trained (preprocessing.py: pymol `byres <lig> around 5`, HOH +
  #   hydrogens removed). Set 0 to feed the FULL receptor, which reproduces
  #   predict_ZccE.py -- but that is a train/inference MISMATCH (the model was
  #   trained on pockets), so full-protein scores are not meaningful affinities.
  # gign_drop_water: drop HOH/WAT; applies when cutting (cutoff > 0).
  # gign_conda_env: set to your GIGN env; leave "" to run plain `python`.
  # gign_model:     leave "" to use yupu_GIGN_pose.py's built-in default checkpoint.
  gign_script: "/home/huangzihang/repos/elion/src/elion/properties/Yupu_GIGN/yupu_GIGN_pose.py"
  gign_model: ""
  gign_conda_env: "elion_backend"
  gign_pocket_cutoff: 5
  gign_drop_water: true
  gign_scratch: "/home/huangzihang/repos/user_data/GIGN"
  gign_timeout_seconds: 1200
  default_dir: "/home/huangzihang/repos/user_data/deepatom"

  # Default docking box loaded into the 3D legend on open: the "Box ctr" x/y/z
  # inputs and the "len" edge length (Å). The user can still drag/edit it.
  # (These match the Vina 8P0M grid box; adjust if the .pdb frame differs.)
  box_center_x: -25.7
  box_center_y: 0.22
  box_center_z: 28.39
  box_length: 20

  # ── Vina score-breakdown log ("Vina" tab in the Pose Generation tool) ────────
  # The "Vina" tab scores the current pose with the full five-term AutoDock Vina
  # function (gauss1 + gauss2 + repulsion + hydrophobic + Hbond, then the Nrot
  # penalty) and can dump the *per-atom-pair* breakdown to a log file, so the
  # total score is auditable pair by pair. For every ligand-atom <-> pocket-atom
  # pair the log records: the surface gap s = r - Ri - Rj, each term's raw and
  # weighted value, and the summed pair_e — the same decomposition the Vina
  # visualizer shows ([non_cache::eval pair] lines). A file named
  #     <name>_vina_breakdown.log
  # is written into this directory (created if missing).
  # Blank → the breakdown is shown in-browser only and nothing is written to disk.
  vina_breakdown_dir: "/home/huangzihang/repos/user_data/vina_breakdown"

  # ── Searched-pose auto-save ("▶ Run search" on the Monte-Carlo tab) ──────────
  # When the Monte-Carlo search finishes, the best pose is auto-saved here as
  # <timestamp>.pdb (the same ligand-pose .pdb the "⤓ Generate pose .pdb" button
  # produces), so every completed search leaves an artifact on disk without the
  # user having to click export. Created if missing. Also used as the fallback
  # for POST /pose/save_pdb when its request supplies no explicit out_dir.
  # Blank → the search does not auto-save (use the export button instead).
  search_pose_dir: "/home/huangzihang/repos/user_data/search_pose"