      default_receptor: "/home/huangzihang/repos/elion/src/visualizer/nas_storage_app/converted_pdbqt/receptor/EAlphaReceptor_1ERR.pdbqt"
      default_ligand:   "/home/huangzihang/repos/elion/src/visualizer/nas_storage_app/converted_pdbqt/ligand/G001a_EAlphaReceptor_pocket1_SP_Score_-11.880.pdbqt"
